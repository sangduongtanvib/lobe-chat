version: '3.8'

services:
  lobe-chat-database:
    image: lobe-chat-database:latest
    ports:
      - "3210:3210"
    environment:
      # General Configuration
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3210
      - APP_URL=https://your-app.azurecontainerapps.io
      
      # Database Configuration (Required)
      - DATABASE_DRIVER=node
      - DATABASE_URL=postgresql://username:password@your-postgres-server.postgres.database.azure.com:5432/database_name?sslmode=require
      
      # Security (Set these in production)
      - KEY_VAULTS_SECRET=your-encryption-key-here
      - NEXTAUTH_SECRET=your-nextauth-secret-here
      - ACCESS_CODE=your-access-code-here
      
      # Clerk Authentication (if using Clerk)
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=your-clerk-publishable-key
      - CLERK_SECRET_KEY=your-clerk-secret-key
      - CLERK_WEBHOOK_SECRET=your-clerk-webhook-secret
      
      # OpenAI Configuration (if using OpenAI)
      - OPENAI_API_KEY=your-openai-api-key
      - OPENAI_PROXY_URL=https://api.openai.com/v1
      
      # Azure OpenAI Configuration (if using Azure OpenAI)
      - AZURE_API_KEY=your-azure-openai-api-key
      - AZURE_ENDPOINT=https://your-resource.openai.azure.com
      - AZURE_API_VERSION=2024-02-15-preview
      
      # S3 Configuration (if using file storage)
      - S3_ACCESS_KEY_ID=your-s3-access-key
      - S3_SECRET_ACCESS_KEY=your-s3-secret-key
      - S3_ENDPOINT=https://your-storage-account.blob.core.windows.net
      - S3_BUCKET=your-container-name
      - S3_REGION=your-region
      
      # Feature Flags
      - FEATURE_FLAGS={}
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3210/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    driver: bridge
