# Nginx configuration for WAF-friendly Next.js chunk handling
# Add these rules to your nginx server block

# Rewrite WAF-friendly URLs back to original Next.js chunk URLs
location ~* ^/static/js/(.+)\.js$ {
    # Convert WAF-friendly patterns back to original
    set $chunk_name $1;
    
    # Replace our safe patterns back to original characters
    set $chunk_name_decoded $chunk_name;
    if ($chunk_name_decoded ~ (.*)_OB_(.*)) {
        set $chunk_name_decoded $1%5B$2;
    }
    if ($chunk_name_decoded ~ (.*)_CB_(.*)) {
        set $chunk_name_decoded $1%5D$2;
    }
    if ($chunk_name_decoded ~ (.*)_AT_(.*)) {
        set $chunk_name_decoded $1%40$2;
    }
    if ($chunk_name_decoded ~ (.*)_OP_(.*)) {
        set $chunk_name_decoded $1($2;
    }
    if ($chunk_name_decoded ~ (.*)_CP_(.*)) {
        set $chunk_name_decoded $1)$2;
    }
    
    # Rewrite to actual Next.js chunk location
    try_files $uri /_next/static/chunks/$chunk_name_decoded.js =404;
}

# Alternative approach: Direct proxy to clean URLs
location ~* ^/_next/static/chunks/.*(%5B|%5D|%40|\(|\)).*$ {
    # Log the problematic request
    access_log /var/log/nginx/waf_blocked_chunks.log;
    
    # Return 404 or redirect to a clean version
    return 404;
}
