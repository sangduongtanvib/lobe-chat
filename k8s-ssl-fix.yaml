apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobe-chat-ssl-fixed
  labels:
    app: lobe-chat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobe-chat
  template:
    metadata:
      labels:
        app: lobe-chat
    spec:
      containers:
      - name: lobe-chat
        image: your-image-name  # Thay thế bằng tên image của bạn
        ports:
        - containerPort: 3210
        env:
        # SSL Configuration - Fix self-signed certificate errors
        - name: NODE_TLS_REJECT_UNAUTHORIZED
          value: "0"
        - name: NODE_EXTRA_CA_CERTS
          value: ""
        - name: SSL_CERT_DIR
          value: "/etc/ssl/certs/ca-certificates.crt"
        
        # Node.js Configuration
        - name: NODE_ENV
          value: "production"
        - name: NODE_OPTIONS
          value: "--dns-result-order=ipv4first --use-openssl-ca"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        
        # Application Configuration
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: PORT
          value: "3210"
        
        # Service Worker Configuration (disable for SSL issues)
        - name: NEXT_PUBLIC_SERVICE_WORKER_ENABLED
          value: "false"
        - name: WAF_ENABLE_SERVICE_WORKER
          value: "false"
        - name: WAF_DEBUG_MODE
          value: "false"
        
        # SSL Debug
        - name: NODE_DEBUG_SSL
          value: "0"
        
        # Health check
        livenessProbe:
          httpGet:
            path: /
            port: 3210
          initialDelaySeconds: 40
          periodSeconds: 30
          timeoutSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /
            port: 3210
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: lobe-chat-service
spec:
  selector:
    app: lobe-chat
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3210
  type: LoadBalancer 