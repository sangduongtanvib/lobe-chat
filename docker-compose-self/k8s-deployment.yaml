apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobechat-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobechat
  template:
    metadata:
      labels:
        app: lobechat
    spec:
      containers:
      - name: lobechat
        image: your-registry/lobechat:latest
        ports:
        - containerPort: 3210
          name: app
        - containerPort: 8000
          name: auth
        - containerPort: 9000
          name: s3-api
        - containerPort: 9001
          name: s3-console
        - containerPort: 5432
          name: postgres
        env:
        - name: AZURE_API_KEY
          valueFrom:
            secretKeyRef:
              name: lobechat-secrets
              key: azure-api-key
        - name: AZURE_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: lobechat-secrets
              key: azure-endpoint
        - name: AZURE_CONTAINER_URL
          value: "https://your-container-app.azurecontainerapps.io"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lobechat-secrets
              key: postgres-password
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lobechat-secrets
              key: minio-password
        volumeMounts:
        - name: postgres-data
          mountPath: /app/data
        - name: minio-data
          mountPath: /app/s3_data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: minio-data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: lobechat-service
spec:
  selector:
    app: lobechat
  ports:
  - name: app
    port: 80
    targetPort: 3210
  type: LoadBalancer
